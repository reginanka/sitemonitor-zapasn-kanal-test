name: Screenshot Only (to Mongo)

on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: \~/.cache/ms-playwright
          key: \( {{ runner.os }}-playwright- \){{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright (browser + system deps)
        run: |
          echo "Playwright cache hit: ${{ steps.playwright-cache.outputs.cache-hit }}"
          python -m playwright --version
          python -m playwright install chromium --with-deps

      - name: Run screenshot-only script
        env:
          URL: ${{ secrets.URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_LOG_CHANNEL_ID: ${{ secrets.TELEGRAM_LOG_CHANNEL_ID }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          RENDER_SCHEDULE_IMAGES: "1"
        run: python screenshot_only.py
