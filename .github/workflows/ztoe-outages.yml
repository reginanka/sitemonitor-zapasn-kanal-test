name: ZTOE outages

on:
  workflow_dispatch:
  schedule:
    # Кожні 15 хвилин
    - cron: "*/15 * * * *"

concurrency:
  group: ztoe-outages
  cancel-in-progress: false

jobs:
  ztoe-outages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MAYACHOK_MONGO_URI: ${{ secrets.MAYACHOK_MONGO_URI }}
      ZTOE_MONGO_DB: ${{ secrets.ZTOE_MONGO_DB }}
      ZTOE_BOT_TOKEN: ${{ secrets.ZTOE_BOT_TOKEN }}
      ZTOE_API_BASE: ${{ secrets.ZTOE_API_BASE }}
      TELEGRAM_LOG_CHANNEL_ID: ${{ secrets.TELEGRAM_LOG_CHANNEL_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # python-telegram-bot 20.8 потребує httpx~=0.26
          pip install "httpx~=0.26.0" "pymongo>=4.6" "python-telegram-bot==20.8"

      - name: Run ZTOE outages monitor
        run: python ztoe_outages_monitor.py
