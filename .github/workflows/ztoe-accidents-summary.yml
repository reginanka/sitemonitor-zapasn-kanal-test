name: ZTOE accidents summary (hourly)

on:
  schedule:
    # кожну годину о :05 (UTC) → ~07:05, 08:05 … Київ (UTC+2/+3)
    - cron: "5 * * * *"
  workflow_dispatch:

concurrency:
  group: ztoe-accidents-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ZTOE_API_BASE: ${{ secrets.ZTOE_API_BASE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_LOG_CHANNEL_ID: ${{ secrets.TELEGRAM_LOG_CHANNEL_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx~=0.26.0" "python-telegram-bot==20.8" pytz

      - name: Run accidents summary
        run: python ztoe_accidents_summary.py
