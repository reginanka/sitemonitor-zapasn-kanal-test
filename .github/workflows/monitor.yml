name: Monitor Schedule Updates

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium --with-deps

      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Run monitoring script
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          URL: ${{ secrets.URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_LOG_CHANNEL_ID: ${{ secrets.TELEGRAM_LOG_CHANNEL_ID }}
          SUBSCRIBE: ${{ secrets.SUBSCRIBE }}
          MAYACHOK_MONGO_URI: ${{ secrets.MAYACHOK_MONGO_URI }}
          ZTOE_MONGO_DB: ${{ secrets.ZTOE_MONGO_DB }}
          MONGO_URI: ${{ secrets.MAYACHOK_MONGO_URI }}
          MONGO_DB: ${{ secrets.ZTOE_MONGO_DB }}
          ZTOE_BOT_TOKEN: ${{ secrets.ZTOE_BOT_TOKEN }}
        run: python monitor.py

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/current.json data/last_hash.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update schedule [skip ci]"

      - name: Push changes
        run: git push || true
