name: ZTOE channel — set last_id

on:
  workflow_dispatch:
    inputs:
      last_id:
        description: "Нове значення last_id (перезаписується без перевірок)"
        required: true
        default: "1902"

# не перетинатись із самим монітором
concurrency:
  group: ztoe-channel
  cancel-in-progress: false

jobs:
  set-last-id:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB: ${{ secrets.MONGO_DB }}
      ZTOE_CHANNEL_URL: ${{ secrets.ZTOE_CHANNEL_URL }}
      LAST_ID: ${{ github.event.inputs.last_id }}
      # імпорт монітора тягне ці модулі; самі значення тут не використовуються
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ZTOE_BOT_TOKEN: ${{ secrets.ZTOE_BOT_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx~=0.26.0" requests beautifulsoup4 pytz "pymongo>=4.6" "python-telegram-bot==20.8"

      - name: Set last_id in Mongo
        run: python ztoe_channel_set_last_id.py
