name: Force Diff Ukrenergo 2 (Mongo)

on:
  workflow_dispatch:
    inputs:
      force_status:
        description: "Статус, який записати в Mongo (потім monitor побачить різницю)"
        required: true
        default: "shortage"
        type: choice
        options:
          - normal
          - shortage
          - outage_schedules
          - emergency_outages
          - grid_damage

jobs:
  force-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_LOG_CHANNEL_ID: ${{ secrets.TELEGRAM_LOG_CHANNEL_ID }}
      SUBSCRIBE: ${{ secrets.SUBSCRIBE }}
      UKRENERGO2_REGIONS_URL: ${{ secrets.UKRENERGO2_REGIONS_URL }}
      UKRENERGO2_REGION_SLUG: ${{ secrets.UKRENERGO2_REGION_SLUG }}
      UKRENERGO2_REGION_NAME: ${{ secrets.UKRENERGO2_REGION_NAME }}
      MAYACHOK_MONGO_URI: ${{ secrets.MAYACHOK_MONGO_URI }}
      MAYACHOK_MONGO_DB: ${{ secrets.MAYACHOK_MONGO_DB }}
      UKRENERGO_SITE_URL: ${{ secrets.UKRENERGO_SITE_URL }}
      UKRENERGO2_SYNC_REGIONSTATUS: "1"
      FORCE_STATUS: ${{ inputs.force_status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-telegram-bot==20.8 pytz "pymongo>=4.6"

      - name: Force different state into Mongo
        run: python ukrenergo2_force_diff.py
