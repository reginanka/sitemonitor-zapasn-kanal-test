name: Monitor Ukrenergo 2

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '*/20 * * * *'

jobs:
  ukrenergo2:
    runs-on: ubuntu-latest
    # contents: read достатньо — стан більше не комітимо в git
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_LOG_CHANNEL_ID: ${{ secrets.TELEGRAM_LOG_CHANNEL_ID }}
      SUBSCRIBE: ${{ secrets.SUBSCRIBE }}
      # обов'язково: URL на regions.json
      UKRENERGO2_REGIONS_URL: ${{ secrets.UKRENERGO2_REGIONS_URL }}
      # опційно: за замовчуванням zhytomyr
      UKRENERGO2_REGION_SLUG: ${{ secrets.UKRENERGO2_REGION_SLUG }}
      UKRENERGO2_REGION_NAME: ${{ secrets.UKRENERGO2_REGION_NAME }}
      # Mongo (стан замість data/ukrenergo2_state.json)
      MAYACHOK_MONGO_URI: ${{ secrets.MAYACHOK_MONGO_URI }}
      MAYACHOK_MONGO_DB: ${{ secrets.MAYACHOK_MONGO_DB }}
      # 1 = дублювати в regionstatuses для бота Маячок
      UKRENERGO2_SYNC_REGIONSTATUS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-telegram-bot==20.8 pytz "pymongo>=4.6"

      - name: Run Ukrenergo 2 monitor
        run: python ukrenergo2_monitor.py
