name: ZTOE queues weekly

on:
  workflow_dispatch:
  schedule:
    # Щонеділі о 04:00 UTC (~06:00–07:00 Київ залежно від DST)
    - cron: "0 4 * * 0"

jobs:
  ztoe-queues:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Mongo — той самий URI, що в інших workflows; БД — окремий secret
      MAYACHOK_MONGO_URI: ${{ secrets.MAYACHOK_MONGO_URI }}
      ZTOE_MONGO_DB: ${{ secrets.ZTOE_MONGO_DB }}
      # Токен бота відключень (не канал Ukrenergo)
      ZTOE_BOT_TOKEN: ${{ secrets.ZTOE_BOT_TOKEN }}
      ZTOE_REQUEST_PAUSE: "0.8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx>=0.27" beautifulsoup4 "pymongo>=4.6" "python-telegram-bot==20.8"

      - name: Run ZTOE queue monitor
        run: python ztoe_queue_monitor.py
