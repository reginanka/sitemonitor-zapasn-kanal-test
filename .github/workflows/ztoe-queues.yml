name: ZTOE queues weekly

on:
  workflow_dispatch:
  schedule:
    # Щонеділі о 04:00 UTC
    - cron: "0 4 * * 0"

jobs:
  ztoe-queues:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MAYACHOK_MONGO_URI: ${{ secrets.MAYACHOK_MONGO_URI }}
      ZTOE_MONGO_DB: ${{ secrets.ZTOE_MONGO_DB }}
      ZTOE_BOT_TOKEN: ${{ secrets.ZTOE_BOT_TOKEN }}
      TELEGRAM_LOG_CHANNEL_ID: ${{ secrets.TELEGRAM_LOG_CHANNEL_ID }}
      ZTOE_REQUEST_PAUSE: "0.8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # python-telegram-bot 20.8 потребує httpx~=0.26
          pip install "httpx~=0.26.0" beautifulsoup4 "pymongo>=4.6" "python-telegram-bot==20.8"

      - name: Run ZTOE queue monitor
        run: python ztoe_queue_monitor.py
