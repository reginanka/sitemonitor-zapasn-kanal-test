name: Regenerate queue images

on:
  workflow_dispatch:
    inputs:
      only_missing:
        description: "Лише черги без image_file_id"
        type: boolean
        default: false
      dry_run:
        description: "Dry-run (без запису в Mongo)"
        type: boolean
        default: false

jobs:
  regenerate-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MAYACHOK_MONGO_URI: ${{ secrets.MAYACHOK_MONGO_URI }}
      MAYACHOK_MONGO_DB: ${{ secrets.MAYACHOK_MONGO_DB }}
      ZTOE_MONGO_DB: ${{ secrets.ZTOE_MONGO_DB }}
      UKRENERGO2_REGION_SLUG: ${{ secrets.UKRENERGO2_REGION_SLUG }}
      REGENERATE_OPERATOR: "Житомиробленерго"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_LOG_CHANNEL_ID: ${{ secrets.TELEGRAM_LOG_CHANNEL_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pymongo>=4.6" pytz playwright
          python -m playwright install chromium --with-deps

      - name: Regenerate images from Mongo
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.only_missing }}" = "true" ]; then
            ARGS="$ARGS --only-missing"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python regenerate_images.py $ARGS
