<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Графік відключень</title>
<style>
:root{
  color-scheme:dark;
  --bg:#090e1a;
  --card:#131b2e;
  --inner:#19243c;
  --border:rgba(255,255,255,.12);
  --text:#fff;
  --muted:#94a3b8;
  --dim:#64748b;
  --ok:#10b981;
  --bad:#ef4444;
  --planned:#f59e0b;
  --emerg:#a855f7;
  --wait:#334155;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.35;padding:14px 10px;
  overflow-x:hidden;
}
.wrap{width:100%;max-width:480px;margin:0 auto}

/* 1. Статус Укренерго */
.status-card{
  background:#2a1523;border:1px solid #a8343a;border-left:5px solid var(--bad);
  border-radius:12px;padding:12px 14px;margin-bottom:10px;
}
.status-top{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#fecaca}
.status-dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 6px var(--bad)}
.status-sub{font-size:12.5px;margin-top:4px;color:#ffeded}
.status-period{font-size:12px;font-weight:600;color:#fca5a5;margin-top:4px;white-space:pre-line}

/* 2. Шапка черги */
.header-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.queue-pill{
  flex:none;background:#fbbf24;color:#000;font-size:15px;font-weight:800;
  padding:5px 12px;border-radius:7px;letter-spacing:.5px;
}
.operator-box{text-align:right;min-width:0}
.operator-name{font-size:13px;font-weight:700;overflow-wrap:anywhere}
.updated-at{font-size:11px;color:var(--muted)}

/* 3. Легенда */
.legend{
  display:flex;flex-wrap:wrap;gap:6px 12px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:8px 10px;margin-bottom:10px;
}
.lg-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.lg-dot{width:8px;height:8px;border-radius:2px;flex:none}

/* 4. Картка дня */
.day-card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:12px;margin-bottom:10px;
}
.day-header{
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:6px 8px;margin-bottom:10px;
}
.day-title{font-size:14.5px;font-weight:700}
.day-date{color:var(--muted);font-weight:500}
.total-pill{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px}
.total-pill.bad{background:rgba(239,68,68,.2);color:#fca5a5}
.total-pill.wait{background:rgba(245,158,11,.2);color:#fde68a}
.total-pill.ok{background:rgba(16,185,129,.2);color:#a7f3d0}
.day-note{font-size:12px;color:var(--muted);margin-bottom:8px}

/* Інтервали */
.intervals-title{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--muted);font-weight:700;margin-bottom:6px;
}
.intervals-grid{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.interval-badge{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 8px;
  padding:7px 10px;border-radius:7px;border-left:4px solid;background:var(--inner);
}
.interval-badge.schedule{border-color:var(--bad)}
.interval-badge.planned{border-color:var(--planned)}
.interval-badge.emerg{border-color:var(--emerg)}
.ib-left{display:flex;align-items:center;gap:7px}
.ib-time{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.ib-tag{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:4px;color:#fff;white-space:nowrap}
.schedule .ib-tag{background:#dc2626}
.planned .ib-tag{background:#d97706}
.emerg .ib-tag{background:#9333ea}
.ib-right{font-size:11.5px;font-weight:500;color:var(--muted)}

/* Шкала */
.timeline-wrapper{
  background:var(--inner);border:1px solid rgba(255,255,255,.08);
  border-radius:9px;padding:7px 6px 5px;
}
.timeline-row{margin-bottom:7px}
.timeline-row:last-child{margin-bottom:0}
.timeline-section-title{
  display:flex;justify-content:space-between;font-size:9.5px;font-weight:700;
  color:var(--dim);text-transform:uppercase;margin-bottom:3px;
}
.hours-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px}
.hour-box{display:flex;flex-direction:column;align-items:center;min-width:0}
.slots-pair{
  display:flex;width:100%;height:22px;border-radius:3px;overflow:hidden;
  background:rgba(0,0,0,.3);gap:1px;
}
.s-half{flex:1;min-width:0;height:100%}
.s-half.ok{background:var(--ok)}
.s-half.off{background:var(--bad)}
.s-half.planned{background:var(--planned)}
.s-half.emerg{background:var(--emerg)}
.s-half.wait{background:var(--wait)}
.hour-label{font-size:9.5px;font-weight:700;margin-top:2px;color:var(--muted)}
.hour-label.accent{color:#fff}

@media (max-width:340px){
  .hour-label{font-size:8.5px}
  .ib-time{font-size:13px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<noscript>
  <p style="padding:16px;color:#fca5a5">Для відображення графіка потрібен JavaScript.</p>
</noscript>

<script>
/* ===================== ДАНІ (міняти тільки тут) =====================
   type: 'schedule' — за графіком (червоний)
         'planned'  — планове (жовтий)
         'emerg'    — аварійне (фіолетовий)
   from/to — "ГГ:ХХ"; note — коротка примітка (необов'язково)
   date    — дата для підпису "ДД.ММ"; якщо не вказати, підставиться сама
   known   — false = графік ще не опубліковано (сіра шкала)
   period: один день  { from:'06:00', to:'23:59' }
           кілька днів { from:'22:00', fromDate:'16.10', to:'01:00', toDate:'17.10' } */
var DATA = {
  statusTitle: 'Статус Житомирської області',
  statusSub:   'За розпорядженням НЕК Укренерго застосовано графіки погодинних відключень',
  period:      { from:'06:00', to:'23:59' },
  queue:       '4.2',
  operator:    'Житомиробленерго',
  updated:     '16.10 о 08:30',            // '' — щоб прибрати рядок
  days: [
    { label:'Сьогодні', date:'16.10', offset:0, known:true, events:[
      { type:'planned',  from:'10:00', to:'14:00', note:'Ремонт' },
      { type:'emerg',    from:'16:20', to:'17:45' },
      { type:'schedule', from:'19:30', to:'22:00' }
    ]},
    { label:'Завтра', date:'17.10', offset:1, known:false, waitNote:'Розпорядження НЕК Укренерго очікується після 18:00', events:[] }
  ]
};
/* ==================================================================== */

var TAG   = { schedule:'Графік', planned:'Планове', emerg:'Аварійне' };
var CLS   = { schedule:'off',    planned:'planned', emerg:'emerg' };
var PRIO  = { schedule:1, planned:2, emerg:3 };

function pad(n){ return (n<10?'0':'')+n; }
function toMin(s){ var p=String(s).split(':'); return (+p[0])*60+(+p[1]||0); }
function fmtDur(m){
  var h=Math.floor(m/60), r=m%60, a=[];
  if(h) a.push(h+' год');
  if(r) a.push(r+' хв');
  return a.join(' ')||'0 хв';
}
function autoDate(offset){
  var d=new Date(); d.setDate(d.getDate()+(offset||0));
  return pad(d.getDate())+'.'+pad(d.getMonth()+1);
}
function el(tag, cls, text){
  var e=document.createElement(tag);
  if(cls) e.className=cls;
  if(text!==undefined) e.textContent=text;
  return e;
}
function evRange(e){
  var f=toMin(e.from), t=toMin(e.to);
  if(t<=f) t=24*60; // інтервал через північ — обрізаємо до кінця доби
  return [f,t];
}

/* стан півгодинного слота (0..47) */
function slotClass(day, slot){
  var a=slot*30, b=a+30, best=null;
  day.events.forEach(function(e){
    var r=evRange(e);
    var overlap=Math.min(b,r[1])-Math.max(a,r[0]);
    if(overlap>=15 && (!best || PRIO[e.type]>PRIO[best])) best=e.type;
  });
  if(best) return CLS[best];
  return day.known ? 'ok' : 'wait';
}

/* сумарний час без світла з точних інтервалів (з об'єднанням перетинів) */
function totalMinutes(day){
  var rs=day.events.map(evRange).sort(function(x,y){return x[0]-y[0];});
  var sum=0, curS=null, curE=null;
  rs.forEach(function(r){
    if(curE===null || r[0]>curE){
      if(curE!==null) sum+=curE-curS;
      curS=r[0]; curE=r[1];
    } else if(r[1]>curE){ curE=r[1]; }
  });
  if(curE!==null) sum+=curE-curS;
  return sum;
}

function buildTimeline(day){
  var wrap=el('div','timeline-wrapper');
  var rows=[
    {title:'Ніч / Ранок',  range:'00:00 – 12:00', from:0},
    {title:'День / Вечір', range:'12:00 – 24:00', from:12}
  ];
  rows.forEach(function(r){
    var row=el('div','timeline-row');
    var t=el('div','timeline-section-title');
    t.appendChild(el('span','',r.title));
    t.appendChild(el('span','',r.range));
    row.appendChild(t);
    var grid=el('div','hours-grid');
    for(var k=0;k<12;k++){
      var h=r.from+k;
      var box=el('div','hour-box');
      var pair=el('div','slots-pair');
      for(var s=0;s<2;s++) pair.appendChild(el('div','s-half '+slotClass(day,h*2+s)));
      box.appendChild(pair);
      box.appendChild(el('div','hour-label'+(h%3===0?' accent':''),pad(h)));
      grid.appendChild(box);
    }
    row.appendChild(grid);
    wrap.appendChild(row);
  });
  return wrap;
}

function buildDay(day){
  var card=el('div','day-card');

  var head=el('div','day-header');
  var title=el('div','day-title',day.label+' ');
  title.appendChild(el('span','day-date','· '+(day.date||autoDate(day.offset))));
  head.appendChild(title);

  var mins=totalMinutes(day), pill;
  if(!day.known){ pill=el('div','total-pill wait','Очікується графік'); }
  else if(mins>0){ pill=el('div','total-pill bad','Всього: '+fmtDur(mins)+' без світла'); }
  else { pill=el('div','total-pill ok','Відключень немає'); }
  head.appendChild(pill);
  card.appendChild(head);

  if(!day.known && day.waitNote) card.appendChild(el('div','day-note',day.waitNote));

  if(day.events.length){
    card.appendChild(el('div','intervals-title','Години без світла:'));
    var grid=el('div','intervals-grid');
    day.events.slice().sort(function(a,b){return toMin(a.from)-toMin(b.from);}).forEach(function(e){
      var r=evRange(e);
      var b=el('div','interval-badge '+e.type);
      var left=el('div','ib-left');
      left.appendChild(el('span','ib-time',e.from+' – '+e.to));
      left.appendChild(el('span','ib-tag',TAG[e.type]));
      b.appendChild(left);
      b.appendChild(el('div','ib-right',fmtDur(r[1]-r[0])+(e.note?' · '+e.note:'')));
      grid.appendChild(b);
    });
    card.appendChild(grid);
  }

  card.appendChild(buildTimeline(day));
  return card;
}

function build(){
  var app=document.getElementById('app');

  /* статус */
  var st=el('div','status-card');
  var top=el('div','status-top');
  top.appendChild(el('span','status-dot'));
  top.appendChild(el('span','',DATA.statusTitle));
  st.appendChild(top);
  st.appendChild(el('div','status-sub',DATA.statusSub));
  var P=DATA.period, ptxt;
  if(P.fromDate && P.toDate && P.fromDate!==P.toDate){
    ptxt='Прогнозований період:\nз '+P.from+' ('+P.fromDate+')\nдо '+P.to+' ('+P.toDate+')';
  } else {
    ptxt='Прогнозований період: '+P.from+'-'+P.to;
  }
  st.appendChild(el('div','status-period',ptxt));
  app.appendChild(st);

  /* шапка черги */
  var hd=el('div','header-card');
  hd.appendChild(el('div','queue-pill','ЧЕРГА '+DATA.queue));
  var ob=el('div','operator-box');
  ob.appendChild(el('div','operator-name',DATA.operator));
  if(DATA.updated) ob.appendChild(el('div','updated-at','Оновлено: '+DATA.updated));
  hd.appendChild(ob);
  app.appendChild(hd);

  /* легенда */
  var lg=el('div','legend');
  [['var(--ok)','Світло є'],['var(--bad)','За графіком'],['var(--planned)','Планове'],
   ['var(--emerg)','Аварійне'],['var(--wait)','Невідомо']].forEach(function(x){
    var it=el('div','lg-item');
    var d=el('span','lg-dot'); d.style.background=x[0];
    it.appendChild(d); it.appendChild(document.createTextNode(x[1]));
    lg.appendChild(it);
  });
  app.appendChild(lg);

  /* дні */
  DATA.days.forEach(function(day){ app.appendChild(buildDay(day)); });
}
build();
</script>
</body>
</html>
